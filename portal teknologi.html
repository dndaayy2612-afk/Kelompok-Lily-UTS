<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Informasi Teknologi</title>
<style>
:root{--site-primary:#16b9d8;--site-secondary:#087f9b;--site-background:#f2fbfd;--site-on-primary:#ffffff;--site-on-secondary:#ffffff;--site-on-background:#17313a;--site-font-body:Arial,Helvetica,sans-serif;--site-font-heading:Arial,Helvetica,sans-serif;--site-heading-scale:1;--site-spacing-scale:1;--site-radius-scale:1;--site-decoration-opacity:1;color-scheme:light dark}
*{box-sizing:border-box}body{margin:0;font-family:var(--site-font-body);background:light-dark(#f2fbfd,#101a1e);color:light-dark(#17313a,#e7f4f7);line-height:1.6}.app{min-height:100vh;background-color:light-dark(var(--site-background),#101a1e);color:light-dark(var(--site-on-background),#e7f4f7)}header{margin:16px auto 10px;max-width:1200px;padding:18px 24px;border-radius:12px;background:var(--site-primary);color:var(--site-on-primary);text-align:center;font-size:calc(2rem * var(--site-heading-scale));font-weight:700;letter-spacing:2px;box-shadow:0 4px 12px #087f9b22}nav{max-width:1200px;margin:0 auto 14px;padding:8px 12px;border-radius:12px;background:var(--site-primary);display:flex;justify-content:center;flex-wrap:wrap;gap:6px}nav button{border:0;background:transparent;color:white;padding:7px 15px;border-radius:8px;font-weight:700;cursor:pointer;font-size:.95rem}nav button:hover,nav button.active{background:var(--site-secondary)}.layout{max-width:1200px;margin:auto;display:grid;grid-template-columns:260px 1fr;gap:16px;padding:0 0 16px}.sidebar,.content{background:light-dark(#fff,#19272d);border:1px solid light-dark(#d3eef4,#30454d);border-radius:12px;min-height:390px}.sidebar{background:var(--site-primary);color:white;padding:22px 16px}.sidebar h2{margin:0 0 12px;font-size:1.2rem;letter-spacing:1px}.side-links{display:grid;gap:7px}.side-links button{border:1px solid #ffffff55;background:#ffffff12;color:white;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:.95rem}.side-links button:hover,.side-links button.active{background:white;color:#087f9b}.content{padding:clamp(18px,3vw,34px);overflow:hidden}.eyebrow{color:var(--site-secondary);font-weight:700;text-transform:uppercase;letter-spacing:1.6px;font-size:.78rem}h1{font-size:calc(2rem * var(--site-heading-scale));line-height:1.2;margin:8px 0 14px}h2{line-height:1.25}p{margin:0 0 14px}.hero{padding:24px;border-radius:14px;background:linear-gradient(120deg,#d9f7fc,#f5fdff);color:#17313a;margin:15px 0 20px}.hero h2{font-size:1.55rem;margin:0 0 8px}.btn{border:0;background:var(--site-secondary);color:white;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}.btn:hover{filter:brightness(.92)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:18px 0}.card{border:1px solid light-dark(#d3e8ed,#344850);border-radius:12px;padding:17px;background:light-dark(#fbfeff,#202f35)}.card .symbol{font-size:1.7rem}.card h3{margin:5px 0 7px}.tag{display:inline-block;background:#d9f7fc;color:#086b80;border-radius:20px;padding:3px 10px;font-size:.78rem;font-weight:700;margin-bottom:8px}.list{padding-left:22px}.list li{margin:7px 0}.info-box{padding:14px 16px;border-left:4px solid var(--site-primary);background:light-dark(#e8faff,#20343b);border-radius:6px;margin:16px 0}.contact-form{display:grid;gap:12px;max-width:560px}.contact-form label{font-weight:700;display:grid;gap:5px}.contact-form input,.contact-form textarea{width:100%;padding:11px;border:1px solid #a9cbd2;border-radius:7px;background:light-dark(#fff,#152228);color:inherit;font:inherit}.status{margin-top:12px;font-weight:700;color:var(--site-secondary)}footer{max-width:1200px;margin:0 auto 16px;padding:18px;background:var(--site-primary);color:white;text-align:center;border-radius:12px}footer small{display:block;opacity:.92}.mobile-menu{display:none}
@media(max-width:850px){header,nav,.layout,footer{margin-left:12px;margin-right:12px}.layout{grid-template-columns:1fr}.sidebar{min-height:auto}.side-links{grid-template-columns:repeat(2,minmax(0,1fr))}.sidebar h2{margin-bottom:14px}.content{min-height:350px}}
@media(max-width:520px){header{font-size:1.5rem;padding:16px 10px}.cards{grid-template-columns:1fr}.side-links{grid-template-columns:1fr 1fr}.content{padding:18px}.hero{padding:18px}}
</style></head>
<body><div class="app" id="app"><header>PORTAL INFORMASI TEKNOLOGI</header><nav id="topNav" aria-label="Navigasi utama"></nav><div class="layout"><aside class="sidebar"><h2>SIDEBAR MENU</h2><div class="side-links" id="sideNav"></div></aside><main class="content" id="content" tabindex="-1"></main></div><footer><strong>PORTAL INFORMASI TEKNOLOGI</strong><small>Belajar teknologi dengan mudah, aman, dan bermanfaat.</small><small>© 2026 Kelompok Lily</small></footer></div>
<script>
const pages={
home:{label:'Home',icon:'🏠',eyebrow:'Selamat datang',title:'Mengenal Dunia Teknologi',intro:'Portal Informasi Teknologi adalah website sederhana untuk mengenal perkembangan teknologi, perangkat komputer, aplikasi, dan keamanan digital.',body:`<section class="hero"><span class="tag">BERANDA</span><h2>Teknologi untuk Semua</h2><p>Temukan informasi dan panduan teknologi dengan bahasa yang mudah dipahami. Pilih menu yang ingin kamu baca.</p><button class="btn" onclick="go('artikel')">Jelajahi Artikel →</button></section><h2>Informasi yang Bisa Kamu Temukan</h2><div class="cards"><article class="card"><div class="symbol">📰</div><h3>Berita Teknologi</h3><p>Ikuti perkembangan perangkat dan teknologi digital.</p><button class="btn" onclick="go('berita')">Baca berita</button></article><article class="card"><div class="symbol">💻</div><h3>Perangkat Komputer</h3><p>Pelajari fungsi perangkat keras dan perangkat lunak.</p><button class="btn" onclick="go('hardware')">Pelajari</button></article><article class="card"><div class="symbol">🧭</div><h3>Tutorial</h3><p>Ikuti langkah sederhana untuk memulai keterampilan digital.</p><button class="btn" onclick="go('tutorial')">Lihat tutorial</button></article><article class="card"><div class="symbol">🔐</div><h3>Keamanan Digital</h3><p>Kenali cara melindungi akun dan data pribadi.</p><button class="btn" onclick="go('keamanan')">Baca tips</button></article></div>`},
profil:{label:'Profil',icon:'👤',eyebrow:'Tentang website',title:'Profil Portal',intro:'Halaman ini menjelaskan tujuan dan isi Portal Informasi Teknologi.',body:`<h2>Siapa Kami?</h2><p>Portal Informasi Teknologi merupakan website edukasi yang menyajikan pengetahuan dasar tentang teknologi informasi untuk pelajar dan masyarakat umum.</p><h2>Visi</h2><p>Menjadi sumber belajar teknologi yang sederhana, informatif, dan mudah diakses.</p><h2>Misi</h2><ul class="list"><li>Menyajikan informasi teknologi dengan bahasa yang jelas.</li><li>Mendorong penggunaan teknologi secara bijak.</li><li>Membantu pembaca memahami perangkat dan layanan digital.</li></ul><div class="info-box">Website ini dibuat sebagai contoh proyek pembelajaran pemrograman web.</div>`},
berita:{label:'Berita',icon:'📰',eyebrow:'Kabar terkini',title:'Berita Teknologi',intro:'Contoh berita dan tren teknologi yang perlu diketahui pengguna digital.',body:`<div class="cards"><article class="card"><span class="tag">Perangkat</span><h3>Laptop semakin mendukung aktivitas belajar</h3><p>Laptop membantu pelajar mengerjakan tugas, mengikuti kelas daring, dan mengolah dokumen. Memilih perangkat sebaiknya disesuaikan dengan kebutuhan dan anggaran.</p><small>Topik: Komputer dan pendidikan</small></article><article class="card"><span class="tag">Kecerdasan Buatan</span><h3>AI menjadi alat bantu produktivitas</h3><p>Teknologi kecerdasan buatan dapat membantu merangkum informasi dan mencari ide. Hasilnya tetap perlu diperiksa agar akurat.</p><small>Topik: Teknologi digital</small></article><article class="card"><span class="tag">Internet</span><h3>Koneksi internet mendukung layanan publik</h3><p>Akses internet membantu masyarakat menggunakan layanan informasi dan administrasi secara lebih praktis.</p><small>Topik: Internet dan layanan</small></article><article class="card"><span class="tag">Keamanan</span><h3>Pengguna perlu waspada terhadap tautan palsu</h3><p>Periksa alamat situs dan jangan memasukkan kata sandi melalui tautan yang tidak dikenal.</p><small>Topik: Keamanan digital</small></article></div>`},
artikel:{label:'Artikel',icon:'📚',eyebrow:'Bacaan pilihan',title:'Artikel Teknologi',intro:'Artikel singkat untuk memahami manfaat teknologi dalam kehidupan sehari-hari.',body:`<h2>Manfaat Teknologi Informasi</h2><p>Teknologi informasi membantu manusia mengolah, menyimpan, dan menyampaikan informasi. Dalam pendidikan, teknologi mempermudah akses bahan belajar dan komunikasi antara guru dengan siswa.</p><h3>Contoh pemanfaatan</h3><ul class="list"><li>Mencari referensi pembelajaran melalui sumber tepercaya.</li><li>Membuat dokumen, presentasi, dan laporan.</li><li>Berkomunikasi melalui email atau aplikasi pertemuan daring.</li><li>Menyimpan file secara teratur dan membuat salinan cadangan.</li></ul><h2>Gunakan dengan bijak</h2><p>Periksa kebenaran informasi sebelum membagikannya, hormati hak cipta, dan jaga privasi ketika menggunakan layanan digital.</p><div class="info-box">Tips: biasakan mencantumkan sumber saat memakai informasi dari situs atau buku lain.</div>`},
tutorial:{label:'Tutorial',icon:'🧭',eyebrow:'Panduan praktis',title:'Tutorial Dasar Komputer',intro:'Langkah awal untuk mengelola file dan folder dengan lebih rapi.',body:`<h2>Cara Membuat Folder di Komputer</h2><ol class="list"><li>Buka File Explorer pada Windows.</li><li>Pilih lokasi penyimpanan, misalnya Documents.</li><li>Klik kanan pada area kosong lalu pilih <b>New → Folder</b>.</li><li>Ketik nama folder yang mudah dikenali, misalnya “Tugas Kuliah”.</li><li>Pindahkan file yang sesuai ke folder tersebut.</li></ol><h2>Tips mengelola file</h2><ul class="list"><li>Gunakan nama file yang jelas.</li><li>Kelompokkan dokumen berdasarkan mata kuliah atau tanggal.</li><li>Simpan salinan file penting di media lain.</li><li>Periksa file sebelum menghapusnya.</li></ul><button class="btn" onclick="go('software')">Lanjut ke Perangkat Lunak →</button>`},
hardware:{label:'Perangkat Keras',icon:'🖥️',eyebrow:'Komponen komputer',title:'Perangkat Keras (Hardware)',intro:'Hardware adalah bagian fisik komputer yang dapat dilihat dan disentuh.',body:`<div class="cards"><article class="card"><div class="symbol">🧠</div><h3>Prosesor (CPU)</h3><p>Mengolah instruksi dan menjalankan operasi komputer.</p></article><article class="card"><div class="symbol">🗃️</div><h3>RAM</h3><p>Menyimpan data sementara yang sedang digunakan program.</p></article><article class="card"><div class="symbol">💾</div><h3>SSD atau HDD</h3><p>Menyimpan sistem operasi, aplikasi, dan file pengguna.</p></article><article class="card"><div class="symbol">⌨️</div><h3>Keyboard dan Mouse</h3><p>Membantu pengguna memasukkan perintah dan mengendalikan komputer.</p></article><article class="card"><div class="symbol">🖥️</div><h3>Monitor</h3><p>Menampilkan teks, gambar, dan hasil proses komputer.</p></article><article class="card"><div class="symbol">🔌</div><h3>Motherboard</h3><p>Menghubungkan berbagai komponen agar dapat berkomunikasi.</p></article></div>`},
software:{label:'Perangkat Lunak',icon:'🧩',eyebrow:'Aplikasi dan sistem',title:'Perangkat Lunak (Software)',intro:'Software adalah program atau kumpulan instruksi yang menjalankan tugas pada komputer.',body:`<h2>Jenis perangkat lunak</h2><div class="cards"><article class="card"><h3>1. Sistem Operasi</h3><p>Contoh: Windows, Linux, dan macOS. Sistem operasi mengatur perangkat keras serta menyediakan lingkungan untuk aplikasi.</p></article><article class="card"><h3>2. Aplikasi Produktivitas</h3><p>Contoh: pengolah kata, spreadsheet, dan aplikasi presentasi untuk membantu pekerjaan.</p></article><article class="card"><h3>3. Browser</h3><p>Contoh: Chrome, Firefox, dan Edge. Browser digunakan untuk membuka halaman web.</p></article><article class="card"><h3>4. Aplikasi Keamanan</h3><p>Antivirus dan fitur keamanan membantu mendeteksi atau mencegah ancaman tertentu.</p></article></div><div class="info-box">Unduh aplikasi dari situs resmi atau toko aplikasi tepercaya. Perhatikan izin yang diminta aplikasi.</div>`},
keamanan:{label:'Keamanan Digital',icon:'🔐',eyebrow:'Lindungi data',title:'Keamanan Digital',intro:'Kebiasaan sederhana dapat membantu melindungi akun dan informasi pribadi.',body:`<h2>Lima kebiasaan penting</h2><ol class="list"><li><b>Gunakan kata sandi kuat.</b> Buat kata sandi yang panjang dan berbeda untuk setiap akun.</li><li><b>Aktifkan verifikasi dua langkah.</b> Gunakan lapisan keamanan tambahan jika tersedia.</li><li><b>Waspadai phishing.</b> Jangan sembarangan membuka tautan atau lampiran mencurigakan.</li><li><b>Perbarui perangkat.</b> Pasang pembaruan sistem dan aplikasi dari sumber resmi.</li><li><b>Jaga informasi pribadi.</b> Jangan membagikan kode OTP, kata sandi, atau data sensitif kepada orang lain.</li></ol><div class="info-box"><b>Ingat:</b> pihak resmi tidak seharusnya meminta kata sandi atau kode OTP melalui pesan pribadi.</div>`},
kontak:{label:'Kontak',icon:'✉️',eyebrow:'Hubungi kami',title:'Kontak Portal',intro:'Kirim pertanyaan atau saran melalui formulir contoh di bawah ini.',body:`<form class="contact-form" id="contactForm"><label>Nama<input name="nama" required placeholder="Masukkan nama"></label><label>Email<input name="email" type="email" required placeholder="nama@email.com"></label><label>Pesan<textarea name="pesan" rows="4" required placeholder="Tulis pesan atau saran"></textarea></label><button class="btn" type="submit">Kirim Pesan</button></form><p class="status" id="formStatus" role="status"></p><div class="info-box">Catatan: formulir ini merupakan demonstrasi front-end. Pesan tidak dikirim ke server atau disimpan.</div>`}}
const order=['home','profil','berita','artikel','tutorial','hardware','software','keamanan','kontak'];
function go(key){if(!pages[key])return;document.querySelectorAll('[data-page]').forEach(el=>{el.classList.toggle('active',el.dataset.page===key)});const p=pages[key];document.getElementById('content').innerHTML=`<div class="eyebrow">${p.eyebrow}</div><h1>${p.title}</h1><p>${p.intro}</p>${p.body}`;document.title=p.label+' | Portal Informasi Teknologi';if(key==='kontak'){document.getElementById('contactForm').addEventListener('submit',e=>{e.preventDefault();document.getElementById('formStatus').textContent='Terima kasih! Pesan contoh berhasil diproses di halaman ini.';e.target.reset()})}document.getElementById('content').focus({preventScroll:true});}
const topKeys=['home','profil','berita','artikel','tutorial','kontak'];document.getElementById('topNav').innerHTML=topKeys.map(k=>`<button data-page="${k}" onclick="go('${k}')">${pages[k].label}</button>`).join('');document.getElementById('sideNav').innerHTML=order.map(k=>`<button data-page="${k}" onclick="go('${k}')">${pages[k].icon} &nbsp; ${pages[k].label}</button>`).join('');go('home');
</script></body></html>
